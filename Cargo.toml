[package]
name = "agent-lint"
version = "2.7.0"
edition = "2024"
rust-version = "1.85.0"
license = "MIT"
description = "Configuration linter for Claude Code"

[dependencies]
clap = { version = "4.5", default-features = false, features = ["derive", "help", "std", "usage"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
url = "2"
walkdir = "2"
toml = "0.8"
globset = "0.4"
jsonschema = { version = "0.48", default-features = false }
noyalib = "0.0.15"
strum = "0.27"
strum_macros = "0.27"
comrak = { version = "0.41", default-features = false }

[dev-dependencies]
tempfile = "3"
serial_test = "3"
