[package]
name = "agent-lint"
version = "4.0.7"
edition = "2024"
rust-version = "1.93.1"
license = "MIT"
description = "Configuration linter for Claude Code"

[dependencies]
clap = { version = "4.5", default-features = false, features = ["derive", "help", "std", "usage"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
url = "2"
walkdir = "2"
toml = "1"
toml_edit = "0.25"
globset = "0.4"
jsonschema = { version = "0.61", default-features = false }
noyalib = "0.0.60"
strum = "0.28"
strum_macros = "0.28"
comrak = { version = "0.59", default-features = false }

[dev-dependencies]
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = { version = "3", features = ["full", "visit"] }
tempfile = "3"
serial_test = "4"
