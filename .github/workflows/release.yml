name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  validate-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Read and validate versions
        id: version
        run: |
          PKG_VERSION=$(jq -r '.version' package.json)
          CARGO_VERSION=$(awk '/^\[package\]/{found=1} found && /^version/{gsub(/.*= *"/,""); gsub(/".*/,""); print; exit}' Cargo.toml)

          if [ -z "$PKG_VERSION" ] || [ -z "$CARGO_VERSION" ]; then
            echo "::error::Could not read version from package.json ($PKG_VERSION) or Cargo.toml ($CARGO_VERSION)"
            exit 1
          fi

          if ! echo "$PKG_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid version in package.json: $PKG_VERSION"
            exit 1
          fi

          if [ "$PKG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Version mismatch: package.json=$PKG_VERSION, Cargo.toml=$CARGO_VERSION"
            exit 1
          fi

          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: validate-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            use-cross: true
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
            use-cross: true
          - target: aarch64-apple-darwin
            runner: macos-latest
            use-cross: false

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use-cross
        run: cargo install cross --locked

      - name: Build
        run: |
          if [ "${{ matrix.use-cross }}" = "true" ]; then
            cross build --release --target "${{ matrix.target }}"
          else
            cargo build --release --target "${{ matrix.target }}"
          fi

      - name: Determine version
        id: version
        run: |
          VERSION="${{ needs.validate-version.outputs.version }}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TARGET="${{ matrix.target }}"
          ARCHIVE="agent-lint-v${VERSION}-${TARGET}.tar.gz"

          cp "target/${TARGET}/release/agent-lint" .
          tar -czf "${ARCHIVE}" agent-lint
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-lint-${{ matrix.target }}
          path: ${{ env.ARCHIVE }}

  release:
    needs: [build, validate-version]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Determine version
        id: version
        run: |
          VERSION="${{ needs.validate-version.outputs.version }}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Generate checksums
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          CHECKSUMS="agent-lint-v${VERSION}-checksums.txt"

          cd artifacts
          find . -mindepth 2 -name '*.tar.gz' -exec mv {} . \;
          sha256sum agent-lint-*.tar.gz > "${CHECKSUMS}"
          echo "CHECKSUMS=${CHECKSUMS}" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cd artifacts
          if RELEASE_OUTPUT=$(gh release create "v${VERSION}" \
            --repo "${{ github.repository }}" \
            --title "v${VERSION}" \
            --target "${GITHUB_SHA}" \
            --generate-notes \
            agent-lint-*.tar.gz \
            "agent-lint-v${VERSION}-checksums.txt" 2>&1); then
            printf '%s\n' "$RELEASE_OUTPUT"
          elif [[ "$RELEASE_OUTPUT" == *"a release with the same tag name already exists"* ]]; then
            printf '%s\n' "$RELEASE_OUTPUT"
            echo "Release v${VERSION} already exists, skipping creation."
          else
            printf '%s\n' "$RELEASE_OUTPUT" >&2
            exit 1
          fi

      - name: Update major version tag
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin "refs/tags/v${VERSION}:refs/tags/v${VERSION}" --force
          git tag -fa "v${MAJOR}" "v${VERSION}" -m "Update v${MAJOR} to v${VERSION}"
          git push origin "v${MAJOR}" --force
