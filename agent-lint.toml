[lint]
# Checked-in regression fixtures include deliberately broken repositories and
# are exercised explicitly by tests rather than by repository self-linting.
exclude = ["tests/fixtures/**"]

# Define the repository's public guidance and architectural contracts as
# inputs to the shared documentation-reference checks.
instruction-files = [
  "README.md",
  "SECURITY.md",
  "ARCHITECTURAL_INVARIANTS.md",
  "ARCHITECTURAL_GUIDELINES.md",
]

# These are the repository-owned paths that documentation may cite inline.
inline-path-prefixes = [
  ".github/",
  "docs/",
  "scripts/",
  "src/",
]
